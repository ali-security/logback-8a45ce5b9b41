name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional surefire -Dtest selector; empty runs the full suite'
        required: false
        default: ''

# https://help.github.com/en/actions/automating-your-workflow-with-github-actions/software-installed-on-github-hosted-runners

concurrency:
  # On master/release, we don't want any jobs cancelled so the sha is used to name the group
  # On PR branches, we cancel the job if new commits are pushed
  # More info: https://stackoverflow.com/a/68422069/253468
  group: ${{ (github.ref == 'refs/heads/branch_1.2.18' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release' ) && format('ci-main-{0}', github.sha) || format('ci-main-{0}', github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Test:
    name: JDK ${{ matrix.jdk }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        jdk: [21]
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: true
      max-parallel: 4
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 50
    - name: Set up Java ${{ matrix.jdk }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.jdk }}
        cache: 'maven'
    - name: Install
      # download dependencies, etc, so test log looks better
      shell: bash
      env:
        # macOS leg only: exclude one wall-clock-flaky test class (reason in the file)
        SEAL_MACOS_EXCLUDES: ${{ matrix.os == 'macos-latest' && format('-Dsurefire.excludesFile={0}/.ci/macos-surefire-excludes.txt', github.workspace) || '' }}
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          mvn -B install $SEAL_MACOS_EXCLUDES -Dtest="${{ inputs.test-filter }}" -Dsurefire.failIfNoSpecifiedTests=false
        else
          mvn -B install $SEAL_MACOS_EXCLUDES
        fi
    - name: Repackage logback-classic jars (no tests re-run)
      # second non-clean install pass so the bundle manifest carries the same
      # headers (Originally-Created-By) as the published jar
      if: matrix.os == 'ubuntu-latest'
      run: mvn -B -q install -pl logback-classic -am -Dmaven.test.skip.exec=true
    - name: Skip report and test totals
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "macOS" ]; then
          echo "EXCLUDED on macOS only (runs on Linux/Windows/Travis): ch.qos.logback.classic.net.SocketAppenderMessageLossTest (3 tests): smallQueueSocketAppender intermittently exceeds its 3000 ms @Timeout on the macOS runner"
        fi
        java .ci/SkipReport.java logback-core logback-core-blackbox logback-classic logback-classic-blackbox logback-examples
    - name: Upload logback-classic jars
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: logback-classic-jars
        path: |
          logback-classic/target/logback-classic-*[0-9].jar
          logback-classic/target/logback-classic-*-tests.jar
        if-no-files-found: error


